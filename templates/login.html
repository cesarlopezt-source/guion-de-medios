<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIXCOM News Monitor — Acceso</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F5F6FA;
            color: #2C3E50;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        h2 { font-size: 1.3rem; margin-bottom: 1.8rem; color: #2C3E50; }
        input[type="password"] {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            margin-bottom: 1rem;
            color: #2C3E50;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: #3498DB;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #3498DB;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #2980B9; }
        .error { color: #E74C3C; margin-bottom: 1rem; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="card">
    <h2>🎬 Guion de Medios</h2>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post">
        <input type="password" name="password" placeholder="Contraseña" autofocus required>
        <button type="submit">Ingresar</button>
    </form>
</div>
</body>
</html>
