<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guion de Medios</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
    <h1>🎬 Guion de Medios</h1>
    <div id="header-right">
        <span id="ultima">Cargando…</span>
        <a href="/fuentes">Estado de fuentes</a>
        <button id="btn-refresh" onclick="actualizar()">Actualizar ↺</button>
        {% if en_nube %}<a href="/logout" class="cerrar-sesion">Cerrar sesión</a>{% endif %}
    </div>
</header>

<div id="controls">
    <div id="sort-controls">
        <div id="menus"></div>
        <label>Periodo: <select id="select-periodo" onchange="cambiarPeriodo()"></select></label>
        <label>Orden:
            <select id="select-orden" onchange="cambiarOrden()">
                <option value="importancia">Importancia</option>
                <option value="recientes">Más recientes</option>
            </select>
        </label>
        <span id="result-count"></span>
        <button onclick="seleccionarVisibles()">Seleccionar todo</button>
        <button onclick="quitarSeleccion()">Quitar selección</button>
    </div>
</div>

<div id="news-container"><p class="status-msg">Cargando noticias…</p></div>

<div id="bottom-bar">
    <span id="selected-count">0 noticias seleccionadas</span>
    <button class="link-btn" onclick="abrirHistorial()">Guiones anteriores</button>
    <button id="btn-valorar" class="valorar-btn" onclick="valorarSeleccionadas()" disabled>Valorar ✦</button>
    <select id="select-contenido" title="Qué va en el archivo">
        <option value="completo">Informe completo</option>
        <option value="links">Solo temas y links</option>
    </select>
    <button class="export-btn" onclick="exportar('word')">Word</button>
    <button class="export-btn" onclick="exportar('excel')">Excel</button>
    <button class="export-btn" onclick="exportar('pdf')">PDF</button>
    <button id="btn-brief" class="guion-btn" onclick="abrirBrief()" disabled>📝 Mini brief</button>
    <button id="btn-guion" class="guion-btn" onclick="generarGuion()" disabled>🎬 Generar Guion de medios</button>
</div>

<div id="modal-guion" class="modal" hidden>
    <div class="modal-box">
        <div class="modal-head">
            <h2>Guion de medios</h2>
            <span id="guion-tiempo"></span>
            <button class="cerrar" onclick="cerrarModal('modal-guion')" aria-label="Cerrar">×</button>
        </div>
        <textarea id="guion-texto" oninput="recalcularTiempo()"></textarea>
        <div id="guion-estado"></div>
        <div class="modal-acciones">
            <button onclick="copiarGuion()">Copiar</button>
            <button onclick="descargarGuion('word')">Descargar Word</button>
            <button onclick="descargarGuion('pdf')">Descargar PDF</button>
            <button class="secundario" onclick="generarGuion()">Regenerar</button>
            <button class="secundario" onclick="cerrarModal('modal-guion')">Cerrar</button>
        </div>
    </div>
</div>

<div id="modal-brief" class="modal" hidden>
    <div class="modal-box">
        <div class="modal-head">
            <h2>Mini brief</h2>
            <label>Contenido:
                <select id="select-brief-modo">
                    <option value="brief">Mini brief por noticia</option>
                    <option value="analisis">Análisis general</option>
                    <option value="ambos" selected>Ambos</option>
                </select>
            </label>
            <button id="btn-brief-generar" onclick="generarBrief()">Generar</button>
            <button class="cerrar" onclick="cerrarModal('modal-brief')" aria-label="Cerrar">×</button>
        </div>
        <textarea id="brief-texto"></textarea>
        <div id="brief-estado"></div>
        <div class="modal-acciones">
            <button onclick="copiarBrief()">Copiar</button>
            <button onclick="descargarBrief('word')">Descargar Word</button>
            <button onclick="descargarBrief('pdf')">Descargar PDF</button>
            <button class="secundario" onclick="cerrarModal('modal-brief')">Cerrar</button>
        </div>
    </div>
</div>

<div id="modal-historial" class="modal" hidden>
    <div class="modal-box">
        <div class="modal-head">
            <h2>Guiones anteriores</h2>
            <button class="cerrar" onclick="cerrarModal('modal-historial')" aria-label="Cerrar">×</button>
        </div>
        <ul id="lista-guiones"></ul>
    </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
